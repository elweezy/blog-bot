name: Generate blog post

on:
  schedule:
    - cron: "0 3 * * 3"
  workflow_dispatch:

# No permissions by default; the job below asks for exactly what it needs.
permissions: {}

# Never run two generations at once (a manual run during the scheduled one would race on topics).
concurrency:
  group: generate-post
  cancel-in-progress: false

jobs:
  generate-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Third-party code runs in this job (npm packages, a headless browser), so actions are pinned to exact
      # commits and the checkout doesn't leave a token in .git/config. create-pull-request brings its own auth.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Posts waiting in open PRs aren't on main yet; the bot reads them so it won't repeat a topic.
      - name: Fetch branches of open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in $(gh pr list --state open --json headRefName --jq '.[].headRefName'); do
            git fetch --depth=1 origin "+refs/heads/$branch:refs/remotes/pending/$branch" || true
          done

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      # Renders every Mermaid diagram before publishing, so broken diagrams never reach the site.
      - name: Install mermaid-cli
        run: |
          npm install -g @mermaid-js/mermaid-cli@12.0.0 puppeteer@25.13.0
          echo '{"args":["--no-sandbox"]}' > "$RUNNER_TEMP/puppeteer.json"

      - name: Run blog bot
        id: bot
        working-directory: bot
        run: dotnet run --configuration Release
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
          MERMAID_PUPPETEER_CONFIG: ${{ runner.temp }}/puppeteer.json
          REQUIRE_MERMAID_VALIDATION: "1"

      - name: Create Pull Request
        if: steps.bot.outputs.post_title != ''
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          commit-message: "post: ${{ steps.bot.outputs.post_title }}"
          branch: post-${{ steps.bot.outputs.post_slug }}
          delete-branch: true
          # Requesting a review makes GitHub email the repo owner when a new post is ready.
          reviewers: ${{ github.repository_owner }}
          assignees: ${{ github.repository_owner }}
          title: "New post: ${{ steps.bot.outputs.post_title }}"
          body: |
            New post: `${{ steps.bot.outputs.post_path }}`

            **LinkedIn / RSS summary** (Zapier posts this text with the link):

            > ${{ steps.bot.outputs.post_description }}

            Merge this before the next run if you can. Unmerged posts are still counted, so they won't be written again.
