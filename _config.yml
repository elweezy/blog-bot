# ---- Basic site info ----
title: "Elvin Jamalov · AI engineering notes"
author: "Elvin Jamalov"
email: dzhamalov.elvin@gmail.com
url: "https://elweezystack.net" # main domain
baseurl: ""
tagline: "Agents, retrieval, evals and inference, written for engineers who ship software."
description: "Practical notes on building software with LLMs: agents, RAG, evals, inference cost and the backend around them."
timezone: "UTC"
lang: "en"

# ---- Theme ----
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-avatar

# ---- Build options ----
markdown: kramdown
highlighter: rouge

permalink: /:year/:month/:day/:title/

paginate: 10
paginate_path: "/page:num/"

# ---- Assets (Sass / CSS pipeline) ----
sass:
  sass_dir: _sass
  style: :compressed

minima:
  skin: dark
  social_links:
    github: elweezy
    linkedin: edzhamalov

# ---- Defaults for posts ----
defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: post
      author: "Elvin"

# ---- Exclusions ----
exclude:
  - bot/
  - meta/
  - .github/
  - README.md
  - LICENSE
  - "*.sln"
  - "*.csproj"
  - Gemfile
  - Gemfile.lock
  - vendor/

# ---- Feed (Zapier posts each new item to LinkedIn) ----
feed:
  excerpt_only: true
